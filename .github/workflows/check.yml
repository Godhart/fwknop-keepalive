name: Checks
on: [push, pull_request, workflow_dispatch]
jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y fwknop-client
      - run: pip install -r tools/requirements-vault.txt pytest
      - run: FWKNOP_TEST_BINARY="$(command -v fwknop)" python -m pytest -q tests
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.0.13004108" "cmake;3.22.1"
      - run: chmod +x gradlew && ./gradlew :app:assembleDebug :app:lintDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: spa-keepalive-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
